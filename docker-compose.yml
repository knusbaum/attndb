# Local Qdrant for attndb. Bring it up with:
#   docker compose up -d
# REST/dashboard: http://localhost:6333/dashboard   gRPC (Go client): localhost:6334
services:
  qdrant:
    image: qdrant/qdrant:latest # pin to a specific version (e.g. :v1.16.1) for reproducibility
    container_name: attndb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST + web dashboard
      - "6334:6334" # gRPC — used by github.com/qdrant/go-client
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: "INFO"
